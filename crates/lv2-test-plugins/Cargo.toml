[package]
name = "lv2-test-plugins"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "CC0-1.0"
repository = "https://github.com/JohnDorsey/fastforwardrs"
description = "An LV2 plugin library written for the tests of fastforwardrs, with the Turtle of its bundles: a gain, plugins with every kind of control port, latency, atom ports, a worker, state, and some that misbehave on request"
publish = false

[lib]
# (A library that is loaded at run time, and a Rust library for the tests that want its names and its bundles.)
crate-type = ["cdylib", "rlib"]

[dependencies]
