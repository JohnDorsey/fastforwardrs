[package]
name = "vst3-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/JohnDorsey/fastforwardrs"
description = "Finds, describes and runs VST3 sound plugins, with a host of our own: the fourth part of fastforwardrs that has unsafe code in it"
publish = false

[dependencies]
# (Already in the tree: it is what loads the other plugin kinds' libraries.)
libloading = "0.8.9"
# The interfaces of VST3, as bindings made from the headers of the SDK (MIT or Apache-2.0).
vst3 = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
# The windows that a plugin's window is put in are given as anything that has a window handle (what `winit` windows are).
raw-window-handle = "0.6"

# (Linux: the host's run loop looks at the file descriptors that a plugin's window asks to be told about.)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
vst3-test-plugins = { path = "../vst3-test-plugins", version = "0.1.0" }
tempfile = "3.27.0"
serde_json = "1.0.152"
