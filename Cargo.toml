[package]
name = "fastforwardrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/JohnDorsey/fastforwardrs"
# (The editor is the program that `cargo run` starts; the export from the command line is `cargo run --bin fastforwardrs-export`.)
default-run = "fastforwardrs"

[dependencies]
ab_glyph = "0.2.32"
cosmic-text = "0.19.0"
cpal = "0.18.2"
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
pathdiff = "0.2.3"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tempfile = "3.27.0"
thiserror = "2.0.21"
# Only what is needed to read an archive that another zip program wrote (it may compress what it writes): the archives this program
# writes store everything as it is. (flate2 is in the tree for the PNG reader already; its backend is chosen here so that this does
# not depend on that.)
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# The CRC-32 of the files that are written into an archive (the zip crate uses it too, so it is in the tree already).
crc32fast = "1.5"
# The picture engine (src/engine) uses the graphics library the window is already drawn with, directly: the same version and the same features as
# eframe's (the lock file has them already), and its shader front end to check and limit the shaders it is given. `pollster` waits for what wgpu
# does in the background (the window's own renderer needs it too).
wgpu = "30.0.1"
naga = { version = "30.0.1", features = ["wgsl-in", "wgsl-out"] }
pollster = "0.4.0"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu"] }
# The tests of the picture engine draw the same triangles with the window's own renderer, as the oracle (default features of egui-wgpu are the
# window's anyway: they are on already).
egui-wgpu = "0.36.2"
