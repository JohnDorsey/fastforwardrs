[package]
name = "spikes"
version = "0.0.0"
edition = "2024"
publish = false

# Phase 0.5 spikes of fastforwardrs: THROWAWAY. The versions are the ones the project's Cargo.lock has (wgpu 30.0.1, naga 30.0.1).
[dependencies]
wgpu = { version = "=30.0.1" }
naga = { version = "=30.0.1", features = ["glsl-in", "wgsl-in", "wgsl-out", "spv-out"] }
pollster = "0.4.0"
bytemuck = "1.25.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.152"
half = "2.7.1"

[workspace]
