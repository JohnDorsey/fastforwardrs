# Continuous integration: the same checks on Windows, Ubuntu and macOS.
#
# Written on 2026-10-15 (phase 0.1 of docs/plugin-system-plan-of-action.md) and NOT YET RUN on GitHub: the first push will show what
# needs adjusting (the ffmpeg install steps most of all). What was run for real is the Ubuntu column, by hand, in WSL: see tools/linux/.
#
# What "supported" means per platform (decision Q-19): Windows and Linux: the whole suite passes. macOS: it builds and the headless
# tests pass (nobody here can look at the window on a Mac).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: System libraries (Ubuntu)
        if: runner.os == 'Linux'
        # The sound, window and graphics libraries the program is built against, and a software Vulkan driver (lavapipe) for the tests that draw.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers

      - name: ffmpeg
        # The program is developed and tested against ffmpeg 9.0.2 (README). The integration tests need it; the library tests do not.
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: ffmpeg
        continue-on-error: true

      - name: Show the ffmpeg version
        shell: bash
        run: ffmpeg -version | head -n 1 || echo "no ffmpeg"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Library tests
        run: cargo test --lib --no-fail-fast

      - name: Integration tests
        # Need ffmpeg of the version the program is tested against. On a runner whose ffmpeg is older this step says so and does not fail the
        # build: the first lines of the log are then the thing to read (see the README, "ffmpeg").
        shell: bash
        run: |
          version=$(ffmpeg -version | head -n 1 | sed -n 's/^ffmpeg version [^0-9]*\([0-9]*\)\..*/\1/p')
          echo "ffmpeg major version: ${version:-none}"
          if [ "${version:-0}" -ge 9 ]; then
            FASTFORWARDRS_REQUIRE_FFMPEG=1 cargo test --no-fail-fast --tests
          else
            echo "::warning::ffmpeg ${version:-none} is older than 9: the integration tests were not run"
          fi

      - name: Documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  tools:
    name: tools (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests of the mutation tool (the end-to-end ones need a Rust toolchain and are run locally)
        run: python -m unittest discover -s tools/mutation_testing -p "test_mutation_core.py"

  licences:
    name: licences (REUSE, cargo-deny, third-party notices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every file has a licence (REUSE 3.3)
        uses: fsfe/reuse-action@v5

      - name: Licences, advisories, bans and sources of the dependencies (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: The notices file is up to date (made by `cargo about generate about.hbs`)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Compare THIRD_PARTY.md with what cargo-about makes now
        run: |
          cargo about generate about.hbs > "$RUNNER_TEMP/THIRD_PARTY.md"
          diff -u THIRD_PARTY.md "$RUNNER_TEMP/THIRD_PARTY.md"
