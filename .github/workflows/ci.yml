# Continuous integration: the same checks on Windows, Ubuntu and macOS.
#
# Written on 2026-10-15 (phase 0.1 of docs/plugin-system-plan-of-action.md). The runs since then show that Ubuntu, the licence checks and the
# tools pass, and that the integration tests of Windows and macOS fail (what they say is written as an annotation of the job: see the
# "Integration tests" step). The Ubuntu column was also run by hand, in WSL: see tools/linux/.
#
# What "supported" means per platform (decision Q-19): Windows and Linux: the whole suite passes. macOS: it builds and the headless
# tests pass (nobody here can look at the window on a Mac).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: System libraries (Ubuntu)
        if: runner.os == 'Linux'
        # The sound, window and graphics libraries the program is built against, and a software Vulkan driver (lavapipe) for the tests that draw.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers

      # ffmpeg 9 or newer is needed (README, "ffmpeg"): an older one is refused by the program. The actions that install ffmpeg give older versions
      # or do not run on the Mac of the runner (arm64), so each system gets its own step.
      - name: ffmpeg 9 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath "$env:RUNNER_TEMP/ffmpeg"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Directory | Select-Object -First 1).FullName + "/bin"
          Add-Content $env:GITHUB_PATH $bin

      - name: ffmpeg 9 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          mkdir "$RUNNER_TEMP/ffmpeg" && tar xf ffmpeg.tar.xz --strip-components=1 -C "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Show the ffmpeg version
        id: ffmpeg
        shell: bash
        run: |
          ffmpeg -version | head -n 1 || echo "no ffmpeg"
          # (Written as an annotation too: annotations can be read without signing in to GitHub, the log cannot.)
          echo "::notice title=ffmpeg of the runner ($RUNNER_OS)::$(ffmpeg -version | head -n 1 | cut -c1-120)"
          version=$(ffmpeg -version | head -n 1 | sed -n 's/^ffmpeg version [^0-9]*\([0-9]*\)\..*/\1/p')
          echo "major=${version:-0}" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Every test step goes through tools/ci/run_tests_and_report.sh, which also writes the names of the tests that failed (and what they said) as an annotation of
      # the job: annotations can be read without signing in to GitHub, the log cannot.
      - name: Library tests
        shell: bash
        env:
          # The tests of the picture engine draw on a software graphics adapter (WARP on Windows, lavapipe on Ubuntu, which is installed above). Where there
          # is one they must run: a missing adapter is a failure there and not a quiet skip. (A Mac has none.)
          FASTFORWARDRS_REQUIRE_SOFTWARE_ADAPTER: ${{ runner.os == 'macOS' && '0' || '1' }}
        run: bash tools/ci/run_tests_and_report.sh error "Library tests that failed" cargo test --lib --no-fail-fast

      # The integration tests need ffmpeg 9 or newer (the version the program is tested against); on a runner whose ffmpeg is older they say so and do not run.
      - name: Integration tests
        if: ${{ steps.ffmpeg.outputs.major >= 9 }}
        shell: bash
        env:
          # The export is made by the picture engine, which the tests run on a software graphics adapter (see the step above). Where there is one, the tests of the
          # export must run: a missing adapter is a failure there and not a quiet skip.
          FASTFORWARDRS_REQUIRE_SOFTWARE_ADAPTER: ${{ runner.os == 'macOS' && '0' || '1' }}
        run: |
          # All of them but the ones that measure real time and the ones about what ffmpeg itself does, which have steps of their own.
          separate="application_playback application_sound media_ffmpeg_quirks"
          selection=""
          for file in tests/*.rs; do
            name=$(basename "$file" .rs)
            case " $separate " in
              *" $name "*) ;;
              *) selection="$selection --test $name" ;;
            esac
          done
          FASTFORWARDRS_REQUIRE_FFMPEG=1 bash tools/ci/run_tests_and_report.sh error "Integration tests that failed" cargo test --no-fail-fast $selection

      # Sound without a gap and a picture on time are measured against the clock. A runner with two or three slow processors cannot be asked to pass them (the first CI runs
      # of Windows and macOS failed them while Ubuntu passed; on the maintainer's computer they pass, also with 24 busy processes running beside them), so here they run one at a
      # time and a failure is reported as a WARNING, with the names, and does not make the build red.
      - name: Integration tests that depend on real time (failures are warnings)
        if: ${{ steps.ffmpeg.outputs.major >= 9 }}
        shell: bash
        run: FASTFORWARDRS_REQUIRE_FFMPEG=1 bash tools/ci/run_tests_and_report.sh warning "Real-time tests that failed" cargo test --no-fail-fast --test application_playback --test application_sound -- --test-threads=1

      # What ffmpeg itself does that is not the same on every system. The first CI runs of the tests of video pictures in planes found that ffmpeg for macOS on ARM leaves the
      # last column of a picture that is 65 across and 48 down with no colour and not opaque. That is not the program's to mend, and the preview that does not use ffmpeg for
      # the colours does not have it, so a failure is a WARNING that says what was found, and does not make the build red.
      - name: Integration tests of what ffmpeg itself does on this system (failures are warnings)
        if: ${{ steps.ffmpeg.outputs.major >= 9 }}
        shell: bash
        run: FASTFORWARDRS_REQUIRE_FFMPEG=1 bash tools/ci/run_tests_and_report.sh warning "ffmpeg's own behaviour found" cargo test --no-fail-fast --test media_ffmpeg_quirks

      # The Mac of the runner has no software graphics adapter, only a paravirtual Metal device (a virtual machine's, which is set aside for the tests), so the tests of the picture
      # engine and of the export skip there. This step runs them on that device, to find out whether the engine and the export work on Metal; a failure is a WARNING that
      # says which tests failed, and does not make the build red. The variable is set here and nowhere else: the tests never run on the graphics card of a developer's computer
      # (SF-01), and where there is a software adapter it changes nothing.
      - name: Engine and export tests on the Metal device of the runner (macOS; failures are warnings)
        if: ${{ runner.os == 'macOS' && steps.ffmpeg.outputs.major >= 9 }}
        # (A graphics device that does not answer must not hold the build for hours.)
        timeout-minutes: 20
        continue-on-error: true
        shell: bash
        env:
          FASTFORWARDRS_TESTS_MAY_USE_ANY_ADAPTER: "1"
          FASTFORWARDRS_REQUIRE_FFMPEG: "1"
        run: |
          bash tools/ci/run_tests_and_report.sh warning "Library tests of the engine and the export that failed on Metal" cargo test --lib --no-fail-fast -- engine:: video_export::
          bash tools/ci/run_tests_and_report.sh warning "Integration tests of the export that failed on Metal" cargo test --no-fail-fast --test video_export_pictures --test video_export_runs --test video_export_encoder --test command_line_export

      # Which graphics adapters the runner has, written as an annotation of the job (annotations can be read without signing in). The export is made by the picture
      # engine, so whether a runner has an adapter that is not a software one (a Mac: Metal on a virtual GPU?) decides whether the export can be tested on it.
      - name: Show the graphics adapters
        shell: bash
        continue-on-error: true
        run: |
          list=$(cargo run --example engine_benchmark -- --list 2>&1 | grep -E '^[0-9]+:|adapter|no ' | tr '\n' ';')
          echo "::notice title=Graphics adapters of the runner ($RUNNER_OS)::${list:-none listed}"

      - name: Integration tests were not run
        if: ${{ steps.ffmpeg.outputs.major < 9 }}
        run: |
          echo "::warning::ffmpeg ${{ steps.ffmpeg.outputs.major }} is older than 9, so the integration tests were not run"

      - name: Documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  tools:
    name: tools (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests of the mutation tool (the end-to-end ones need a Rust toolchain and are run locally)
        run: python -m unittest discover -s tools/mutation_testing -p "test_mutation_core.py"

  licences:
    name: licences (REUSE, cargo-deny, third-party notices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every file has a licence (REUSE 3.3)
        uses: fsfe/reuse-action@v5

      - name: Licences, advisories, bans and sources of the dependencies (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: The notices file is up to date (made by `cargo about generate about.hbs`)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Compare THIRD_PARTY.md with what cargo-about makes now
        run: |
          cargo about generate about.hbs | tr -d '\r' > "$RUNNER_TEMP/THIRD_PARTY.md"
          diff -u THIRD_PARTY.md "$RUNNER_TEMP/THIRD_PARTY.md"
