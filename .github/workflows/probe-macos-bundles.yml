# A probe, run by hand or when this file changes: what is inside the macOS disk images of the bundled plugins (the macOS build of the bundles cannot be looked at from another system).
# It reports what it finds as annotations of the job, which can be read without signing in. It changes nothing. To be removed when the macOS builds are in the manifest.
name: probe macOS bundles

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-macos-bundles.yml"

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Download the disk images and say what they are
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe"
          curl -sSL --fail -o dragonfly.dmg https://github.com/michaelwillis/dragonfly-reverb/releases/download/3.2.10/dragonfly-reverb-3.2.10-macos-universal.dmg
          curl -sSL --fail -o dpf.dmg https://github.com/DISTRHO/DPF-Plugins/releases/download/v1.7/DPF-Plugins-v1.7-macos-universal.dmg
          curl -sSL --fail -o surge.zip https://github.com/surge-synthesizer/releases-xt/releases/download/1.3.4/surge-xt-macos-1.3.4-pluginsonly.zip
          for f in dragonfly.dmg dpf.dmg surge.zip; do
            echo "::notice title=checksum $f::$(shasum -a 256 $f | cut -d' ' -f1) $(stat -f %z $f) bytes"
          done
          uname -m | sed 's/^/::notice title=runner machine::/'
          sw_vers | tr '\n' ' ' | sed 's/^/::notice title=runner os::/'

      - name: Mount each disk image and list what is in it
        run: |
          set -u
          cd "$RUNNER_TEMP/probe"
          for name in dragonfly dpf; do
            mkdir -p "mnt-$name"
            hdiutil attach -nobrowse -readonly -noverify -noautoopen -mountpoint "mnt-$name" "$name.dmg" > "attach-$name.txt" 2>&1 || { echo "::warning title=attach $name failed::$(tr '\n' '|' < attach-$name.txt)"; continue; }
            echo "::notice title=top of $name::$(ls -la "mnt-$name" | tr '\n' '|')"
            echo "::notice title=clap files in $name::$(find "mnt-$name" -iname '*.clap' -maxdepth 6 | tr '\n' '|')"
            echo "::notice title=licence files in $name::$(find "mnt-$name" \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'README*' \) -maxdepth 6 | tr '\n' '|')"
            echo "::notice title=other files in $name::$(find "mnt-$name" -maxdepth 3 -type f | head -40 | tr '\n' '|')"
            for clap in $(find "mnt-$name" -iname '*.clap' -maxdepth 6 | head -12 | tr ' ' '#'); do
              path=$(echo "$clap" | tr '#' ' ')
              kind=$( [ -d "$path" ] && echo bundle || echo file )
              echo "::notice title=$kind $(basename "$path")::$(du -sk "$path" | cut -f1) KB; $(find "$path" -type f | head -8 | tr '\n' '|')"
            done
          done

      - name: Architectures and code signatures of what is inside
        run: |
          set -u
          cd "$RUNNER_TEMP/probe"
          unzip -q surge.zip "Surge XT Effects.clap/*" -d surge-unzipped || true
          for path in "surge-unzipped/Surge XT Effects.clap" $(find mnt-dragonfly mnt-dpf -iname '*.clap' -maxdepth 6 2>/dev/null | head -4 | tr ' ' '#'); do
            path=$(echo "$path" | tr '#' ' ')
            [ -e "$path" ] || continue
            binary="$path"
            [ -d "$path" ] && binary=$(find "$path/Contents/MacOS" -type f 2>/dev/null | head -1)
            echo "::notice title=lipo $(basename "$path")::$(lipo -info "$binary" 2>&1 | tr '\n' ' ')"
            echo "::notice title=codesign $(basename "$path")::$(codesign -dv --verbose=2 "$path" 2>&1 | grep -E 'Signature|Authority|flags|TeamIdentifier|Identifier=' | tr '\n' '|')"
            echo "::notice title=quarantine $(basename "$path")::$(xattr "$path" 2>&1 | tr '\n' ' ')"
          done
          echo "::notice title=unix mode of the Surge binary in the zip::$(unzip -Z "$RUNNER_TEMP/probe/surge.zip" 'Surge XT Effects.clap/Contents/MacOS/*' 2>&1 | tr '\n' '|')"
          echo "::notice title=curl::$(curl --version | head -1)"

      - name: Expand the installers of the disk images and look at the plugins inside
        run: |
          set -u
          cd "$RUNNER_TEMP/probe"
          for name in dpf; do
            pkg=$(find "mnt-$name" -maxdepth 1 -name '*.pkg' | head -1)
            echo "::notice title=pkg of $name::$pkg"
            pkgutil --expand-full "$pkg" "expanded-$name" > "expand-$name.txt" 2>&1 || echo "::warning title=expand $name failed::$(tr '\n' '|' < expand-$name.txt)"
            echo "::notice title=top of expanded $name::$(ls "expanded-$name" | tr '\n' '|')"
            echo "::notice title=clap bundles in expanded $name::$(find "expanded-$name" -iname '*.clap' -maxdepth 8 | tr '\n' '|')"
            echo "::notice title=other plugin formats in expanded $name::$(find "expanded-$name" \( -iname '*.vst3' -o -iname '*.component' -o -iname '*.vst' -o -iname '*.lv2' \) -maxdepth 8 | tr '\n' '|')"
            echo "::notice title=licence files in expanded $name::$(find "expanded-$name" \( -iname 'LICENSE*' -o -iname 'COPYING*' \) | head -10 | tr '\n' '|')"
            for clap in $(find "expanded-$name" -iname '*.clap' -maxdepth 8 | head -6 | tr ' ' '#'); do
              path=$(echo "$clap" | tr '#' ' ')
              binary="$path"
              [ -d "$path" ] && binary=$(find "$path/Contents/MacOS" -type f 2>/dev/null | head -1)
              echo "::notice title=expanded $(basename "$path")::$(find "$path" -type f | wc -l) files; $(du -sk "$path" | cut -f1) KB; $(lipo -info "$binary" 2>&1 | tr '\n' ' ') ; $(codesign -dv "$path" 2>&1 | grep -E 'Signature|flags' | tr '\n' '|'); modes: $(find "$path" -type f -exec stat -f '%Sp' {} \; | sort | uniq -c | tr '\n' '|')"
            done
          done
