# Settings for `cargo about generate about.hbs | tr -d '\r' > THIRD_PARTY.md` (the notices of the libraries the program is built from).
# The accepted licences are the ones of deny.toml; keep the two lists the same.
accepted = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
# What is only used to test the program is not in what is given to anyone.
ignore-dev-dependencies = true
ignore-build-dependencies = false
